# Ollama runs on your host (install from https://ollama.com). Neo4j is optional: docker compose --profile neo4j up
services:
  backend:
    build: ./backend
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:3b
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      GRAPH_BACKEND: networkx
      DATA_DIR: /data
      SAMPLE_REPO_DIR: /sample-repository
      CORS_ORIGINS: http://localhost:3000
      HF_HOME: /data/hf
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - app_data:/data
      - ./sample-repository:/sample-repository:ro
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/password123
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]

volumes:
  app_data:
  neo4j_data:
